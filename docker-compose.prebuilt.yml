services:
  voice-service:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "voice-service", "--healthcheck", "127.0.0.1:50051"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    image: ${TSBOT_IMAGE_REGISTRY:-ghcr.io}/${TSBOT_IMAGE_NAMESPACE:-lightningcloude}/${TSBOT_IMAGE_REPO:-mineradio-web-tsbot}-voice-service:${TSBOT_IMAGE_TAG:-latest}
    env_file:
      - tsbot.env
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - voicetmp:/app/tmp

  backend:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health/ready', timeout=4).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    image: ${TSBOT_IMAGE_REGISTRY:-ghcr.io}/${TSBOT_IMAGE_NAMESPACE:-lightningcloude}/${TSBOT_IMAGE_REPO:-mineradio-web-tsbot}-backend:${TSBOT_IMAGE_TAG:-latest}
    env_file:
      - tsbot.env
    environment:
      TSBOT_HOST: 0.0.0.0
      TSBOT_PORT: 8009
      TSBOT_VOICE_GRPC_ADDR: voice-service:50051
      DATABASE_URL: sqlite:///./data/tsbot.db
    depends_on:
      voice-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8009:8009"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - voicetmp:/app/tmp

  web:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: ${TSBOT_IMAGE_REGISTRY:-ghcr.io}/${TSBOT_IMAGE_NAMESPACE:-lightningcloude}/${TSBOT_IMAGE_REPO:-mineradio-web-tsbot}-web:${TSBOT_IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  voicetmp:
