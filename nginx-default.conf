server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Force no-cache for HTML to prevent stale SPA caching
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://backend:8009/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8009/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /cover/ {
        rewrite ^/cover/(.*) /music/photo_new/$1 break;
        proxy_pass https://y.gtimg.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name y.gtimg.cn;
        proxy_set_header Host y.gtimg.cn;
        proxy_set_header Referer "https://y.qq.com/";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
