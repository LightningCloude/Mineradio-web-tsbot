# Browser-side audio analysis traffic is bounded per client. These limits do
# not apply to playback controls, WebSockets, or static files.
limit_conn_zone $binary_remote_addr zone=analysis_per_ip:10m;
limit_req_zone $binary_remote_addr zone=analysis_requests:10m rate=10r/m;
proxy_cache_path /var/cache/nginx/analysis-audio levels=1:2
    keys_zone=analysis_audio_cache:10m max_size=512m inactive=24h use_temp_path=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent browsers from pinning an old SPA entry point after deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    location /api/ {
        # Keep the upstream static so nginx does not depend on Docker's
        # embedded DNS resolver for every proxied request.
        proxy_pass http://backend:8009/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        # Admin endpoints are rooted at /admin in FastAPI, so preserve the
        # original request path instead of applying the /api prefix rewrite.
        proxy_pass http://backend:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8009/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /cover/ {
        rewrite ^/cover/(.*) /music/photo_new/$1 break;
        proxy_pass https://y.gtimg.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name y.gtimg.cn;
        proxy_set_header Host y.gtimg.cn;
        proxy_set_header Referer "https://y.qq.com/";
    }

    # Fixed-host audio proxy for browser-side FFT/offline analysis. The client
    # supplies only a path and query string, so this cannot proxy arbitrary URLs.
    location /audio/qq/ {
        limit_conn analysis_per_ip 1;
        limit_conn_status 429;
        limit_req zone=analysis_requests burst=2 nodelay;
        limit_req_status 429;
        limit_rate_after 512k;
        limit_rate 384k;

        rewrite ^/audio/qq/(.*)$ /$1 break;
        proxy_pass http://aqqmusic.tc.qq.com;
        proxy_http_version 1.1;
        proxy_set_header Host aqqmusic.tc.qq.com;
        proxy_set_header Referer "https://y.qq.com/";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 60s;
        proxy_cache analysis_audio_cache;
        proxy_cache_lock on;
        proxy_cache_valid 200 206 12h;
        proxy_cache_key "$request_uri|$http_range";
        add_header X-Analysis-Cache $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
